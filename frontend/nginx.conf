server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Turn on Gzip Compression (Makes files up to 70% smaller)
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # 2. Cache Static Assets (Forces browser to save CSS/JS/Images)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 3. API Proxy (With your runtime resolution trick)
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://backend:3000;
        proxy_pass $upstream;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. SPA Fallback (Crucial for routing in Single Page Apps)
    location / {
        try_files $uri $uri/ /index.html;
    }
}