server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api/* requests to the backend container
    location /api/ {
        # 127.0.0.11 is Docker's internal DNS server
        resolver 127.0.0.11 valid=30s;
        
        # Using a variable forces Nginx to check DNS at runtime, avoiding startup crashes!
        set $upstream http://backend:3000;
        proxy_pass $upstream;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # All other requests serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }
}